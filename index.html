    <style>
        :root {

            --bg-secondary: #0a101d;

            --text-secondary: #596585;

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: var(--text-primary);
            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .header-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 1rem;
        }

        .hidden-toggle {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .hidden-toggle[aria-pressed="true"] {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-heading {
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.95rem;
            margin: 0 0 1.25rem;
        }

        .section + .section {
            margin-top: 2.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            padding-top: 2.4rem;
            color: inherit;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 0.6rem;

        .card:hover {

            border-color: var(--text-accent);
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.1);

        .card h3 {

            margin: 0;

        .card:hover h3 a {

        .hide-toggle {
            position: absolute;
            top: 8px;

            color: var(--text-secondary);

            color: var(--text-accent);
        }

        .card.is-hidden .hide-toggle {

            background: var(--text-accent);
            color: var(--bg-primary);
        }

        .timer-check {

            cursor: pointer;

        .hours-input {

        .footer {

            font-size: 0.85rem;

        .footer a:hover {

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-accent);
            color: var(--bg-primary);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
            max-width: calc(100% - 32px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        const STORAGE_KEY = "collectClockVisits";
        const NOTIFY_KEY = "collectClockNotify";
        const runningNames = new Set();
        let toastTimer = null;

        function alertsWanted() {
            return localStorage.getItem(NOTIFY_KEY) === "on";
        }

        function canNotify() {
            return typeof Notification !== "undefined" && Notification.permission === "granted";
        }

        function updateNotifyButton() {
            const btn = document.getElementById("notifyToggle");
            if (!btn) return;
            if (typeof Notification === "undefined") {
                btn.hidden = true;
                return;
            }
            const on = alertsWanted() && canNotify();
            btn.setAttribute("aria-pressed", on ? "true" : "false");
            btn.textContent = on ? "Alerts on" : "Alerts off";
            if (Notification.permission === "denied") {
                btn.textContent = "Alerts blocked";
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.textContent = message;
            toast.style.display = "block";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.display = "none";
            }, 5000);
        }

        function notifyReady(name) {
            const message = `${name} is ready to collect`;
            showToast(message);
            if (alertsWanted() && canNotify()) {
                try {
                    new Notification("Collect Clock", { body: message });
                } catch (e) {}
            }
        }

        async function toggleAlerts() {
            if (typeof Notification === "undefined") return;
            if (Notification.permission === "denied") {
                showToast("Notifications are blocked in the browser");
                updateNotifyButton();
                return;
            }
            if (!alertsWanted() || !canNotify()) {
                if (Notification.permission !== "granted") {
                    const result = await Notification.requestPermission();
                    if (result !== "granted") {
                        localStorage.setItem(NOTIFY_KEY, "off");
                        updateNotifyButton();
                        return;
                    }
                }
                localStorage.setItem(NOTIFY_KEY, "on");
                showToast("Alerts on — you'll be notified when a timer ends");
            } else {
                localStorage.setItem(NOTIFY_KEY, "off");
                showToast("Alerts off");
            }
            updateNotifyButton();
        }

        function parseHours(value) {
            const n = parseInt(value, 10);
            return Number.isFinite(n) && n > 0 ? n : 24;
        }

        function normalizeVisit(raw) {
            if (!raw) return { startedAt: null, hours: 24, active: false, hidden: false };
            if (typeof raw === "number") {
                return { startedAt: raw, hours: 24, active: Date.now() < raw + 24 * 3600000, hidden: false };
            }
            return {
                startedAt: typeof raw.startedAt === "number" ? raw.startedAt : null,
                hours: parseHours(raw.hours),
                active: !!raw.active,
                hidden: !!raw.hidden
            };
        }

        function loadVisits() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                return parsed && typeof parsed === "object" ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveVisits(visits) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(visits));
        }

        function remainingMs(visit) {
            if (!visit || !visit.active || !visit.startedAt) return 0;
            return Math.max(0, visit.startedAt + parseHours(visit.hours) * 3600000 - Date.now());
        }

        function fmt(ms) {
            const totalSec = Math.max(0, Math.ceil(ms / 1000));
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
            if (m > 0) return `${m}m ${String(s).padStart(2, "0")}s`;
            return `${s}s`;
        }

        function formatVisited(visit) {
            if (!visit || !visit.startedAt) return "Not started";
            const d = new Date(visit.startedAt);
            const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            if (d.toDateString() === new Date().toDateString()) return `Started ${time}`;
            return `Started ${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
        }

        function settleTimer(name, visits) {
            const visit = normalizeVisit(visits[name]);
            const rem = remainingMs(visit);
            if (visit.active && visit.startedAt && rem === 0) {
                if (runningNames.has(name)) notifyReady(name);
                visit.active = false;
                visits[name] = visit;
                saveVisits(visits);
                runningNames.delete(name);
                return visit;
            }
            if (rem > 0) runningNames.add(name);
            else runningNames.delete(name);
            return visit;
        }

        function applyCardState(card, name, visits) {
            const visit = normalizeVisit(visits[name]);
            const rem = remainingMs(visit);

            const countdown = card.querySelector(".countdown");
            const meta = card.querySelector(".meta");
            const checkbox = card.querySelector(".timer-check");
            const hoursInput = card.querySelector(".hours-input");
            const hideBtn = card.querySelector(".hide-toggle");

            card.classList.toggle("on-cooldown", rem > 0);
            card.classList.toggle("is-hidden", !!visit.hidden);
            if (countdown) countdown.textContent = rem > 0 ? fmt(rem) : "Ready";
            if (meta) meta.textContent = formatVisited(visit);
            if (checkbox) checkbox.checked = rem > 0;
            if (hideBtn) {
                hideBtn.textContent = visit.hidden ? "On" : "Off";
                hideBtn.title = visit.hidden ? "Show this site in the list" : "Hide this site from the list";
            }
            if (hoursInput && document.activeElement !== hoursInput) {
                hoursInput.value = visit.hours;
            }
        }

        function createCard(link, visits) {
            const card = document.createElement("article");
            card.className = "card";
            card.dataset.name = link.name;
            card.innerHTML = `
                <button type="button" class="hide-toggle" title="Hide this site from the list">Off</button>
                <h3><a target="_blank" rel="noopener noreferrer"></a></h3>
                <div class="desc"></div>
                <div class="timer-row">
                    <input type="checkbox" class="timer-check" title="Start or stop the timer">
                    <input type="number" class="hours-input" min="1" max="168" value="24" title="Timer length in hours">
                    <span class="hours-suffix">h</span>
                    <span class="countdown">Ready</span>
                </div>
                <div class="meta"></div>
            `;
            const titleLink = card.querySelector("h3 a");
            titleLink.href = link.url;
            titleLink.textContent = link.name;

            const desc = card.querySelector(".desc");
            if (link.desc) {
                desc.textContent = link.desc;
            } else {
                desc.remove();
            }

            const checkbox = card.querySelector(".timer-check");
            const hoursInput = card.querySelector(".hours-input");
            const hideBtn = card.querySelector(".hide-toggle");
            applyCardState(card, link.name, visits);

            checkbox.addEventListener("change", () => {
                const next = loadVisits();
                const visit = normalizeVisit(next[link.name]);
                visit.hours = parseHours(hoursInput.value);
                hoursInput.value = visit.hours;
                if (checkbox.checked) {
                    visit.startedAt = Date.now();
                    visit.active = true;
                } else {
                    visit.active = false;
                }
                next[link.name] = visit;
                saveVisits(next);
                applyCardState(card, link.name, next);
            });

            hideBtn.addEventListener("click", () => {
                const next = loadVisits();
                const visit = normalizeVisit(next[link.name]);
                visit.hidden = !visit.hidden;
                next[link.name] = visit;
                saveVisits(next);
                renderAll();
            });

            const saveHours = () => {
                const next = loadVisits();
                const visit = normalizeVisit(next[link.name]);
                visit.hours = parseHours(hoursInput.value);
                hoursInput.value = visit.hours;
                next[link.name] = visit;
                saveVisits(next);
                applyCardState(card, link.name, next);
            };
            hoursInput.addEventListener("change", saveHours);
            hoursInput.addEventListener("blur", saveHours);

            return card;
        }

        let showHidden = false;

        function allLinks() {
            return bonusLinks.concat(paidSites);
        }

        function hiddenCount(visits) {
            const stored = visits || loadVisits();
            return allLinks().filter((link) => normalizeVisit(stored[link.name]).hidden).length;
        }

        function updateHiddenButton() {
            const btn = document.getElementById("hiddenToggle");
            if (!btn) return;
            const n = hiddenCount();
            btn.hidden = n === 0 && !showHidden;
            btn.setAttribute("aria-pressed", showHidden ? "true" : "false");
            btn.textContent = showHidden ? `Showing hidden (${n})` : `Hidden (${n})`;
        }

        function renderSection(gridId, links) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = "";
            const visits = loadVisits();
            links
                .filter((link) => showHidden || !normalizeVisit(visits[link.name]).hidden)
                .forEach((link) => grid.appendChild(createCard(link, visits)));
        }

        function renderAll() {
            renderSection("links-grid", bonusLinks);
            renderSection("paid-grid", paidSites);
            updateHiddenButton();
        }

        function tickCountdowns() {
            const visits = loadVisits();
            allLinks().forEach((link) => settleTimer(link.name, visits));
            document.querySelectorAll(".card[data-name]").forEach((card) => {
                applyCardState(card, card.dataset.name, visits);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderAll();
            tickCountdowns();
            const hiddenBtn = document.getElementById("hiddenToggle");
            if (hiddenBtn) {
                hiddenBtn.addEventListener("click", () => {
                    showHidden = !showHidden;
                    renderAll();
                });
            }
            const notifyBtn = document.getElementById("notifyToggle");
            if (notifyBtn) {
                notifyBtn.addEventListener("click", () => {
                    toggleAlerts();
                });
            }
            updateNotifyButton();
            setInterval(tickCountdowns, 1000);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) tickCountdowns();
            });
        });
    </script>
</body>
</html>
