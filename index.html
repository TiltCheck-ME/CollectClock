            line-height: 1.6;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;

            padding: 2rem;
        }

        .section-heading {
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.95rem;
            margin: 0 0 1.25rem;
        }

        .section + .section {
            margin-top: 2.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 0.6rem;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--text-accent);
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.1);
        }

        .card h3 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin: 0;
            transition: color 0.2s ease;
        }

        .card:hover h3 {
            color: var(--text-accent);
        }

        .countdown {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            color: var(--text-accent);
        }

        .card.on-cooldown {
            border-color: var(--clicked-border);
            opacity: 0.7;
        }

        .card.on-cooldown .countdown {
            color: var(--soon);
        }

        .card.on-cooldown:hover {
            border-color: var(--text-accent);
            opacity: 1;
        }

        .card .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .footer {
            text-align: center;
            padding: 4rem 1rem 2rem 1rem;
            margin-top: 2rem;
        }

        .footer p {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--text-accent);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        const STORAGE_KEY = "collectClockVisits";
        const COOLDOWN_MS = 24 * 60 * 60 * 1000;

        function loadVisits() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                return parsed && typeof parsed === "object" ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveVisits(visits) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(visits));
        }

        function remainingMs(name, visits) {
            const ts = visits[name];
            if (!ts) return 0;
            return Math.max(0, ts + COOLDOWN_MS - Date.now());
        }

        function fmt(ms) {
            const totalSec = Math.max(0, Math.ceil(ms / 1000));
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s`;
            if (m > 0) return `${m}m ${String(s).padStart(2, "0")}s`;
            return `${s}s`;
        }

        function formatVisited(ts) {
            if (!ts) return "Not visited";
            const d = new Date(ts);
            const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            if (d.toDateString() === new Date().toDateString()) return `Visited ${time}`;
            return `Visited ${d.toLocaleDateString([], { month: "short", day: "numeric" })} ${time}`;
        }

        function applyCardState(card, name, visits) {
            const rem = remainingMs(name, visits);
            const countdown = card.querySelector(".countdown");
            const meta = card.querySelector(".meta");
            card.classList.toggle("on-cooldown", rem > 0);
            if (countdown) countdown.textContent = rem > 0 ? fmt(rem) : "Ready";
            if (meta) meta.textContent = formatVisited(visits[name]);
        }

        function createCard(link, visits) {
            const card = document.createElement("a");
            card.href = link.url;
            card.className = "card";
            card.target = "_blank";
            card.rel = "noopener noreferrer";
            card.dataset.name = link.name;
            card.innerHTML = `
                <h3></h3>
                <div class="countdown"></div>
                <div class="meta"></div>
            `;
            card.querySelector("h3").textContent = link.name;
            applyCardState(card, link.name, visits);

            const markVisited = () => {
                const next = loadVisits();
                next[link.name] = Date.now();
                saveVisits(next);
                applyCardState(card, link.name, next);
            };

            card.addEventListener("click", markVisited);
            card.addEventListener("auxclick", (e) => {
                if (e.button === 1) markVisited();
            });

            return card;
        }

        function renderSection(gridId, links) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = "";
            const visits = loadVisits();
            links.forEach((link) => grid.appendChild(createCard(link, visits)));
        }

        function tickCountdowns() {
            const visits = loadVisits();
            document.querySelectorAll(".card[data-name]").forEach((card) => {
                applyCardState(card, card.dataset.name, visits);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderSection("links-grid", bonusLinks);
            renderSection("paid-grid", paidSites);
            setInterval(tickCountdowns, 1000);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) tickCountdowns();
            });
        });
