<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#161616">
<title>CollectClock</title>
<style>
:root{--bg:#fff3dc;--paper:#fffaf0;--ink:#161616;--muted:#6b5f4e;--pink:#ff3d8b;--pinkdeep:#d81b6a;--yellow:#ffd23f;--teal:#16b5a5;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4}
.wrap{width:min(860px,calc(100% - 22px));margin:auto;padding:14px 0 60px}
h1{font-size:1.2rem;margin:4px 0 2px}h2{font-size:.95rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:.8rem;margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:10px;box-shadow:3px 3px 0 var(--ink)}.tile b{display:block;font-size:1.5rem;color:var(--pinkdeep);font-variant-numeric:tabular-nums}.tile span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.box{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:14px;box-shadow:3px 3px 0 var(--ink);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}th,td{text-align:left;padding:6px 6px;border-bottom:1px solid #0001;white-space:nowrap}th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px}.bars i{flex:1;background:var(--teal);min-height:2px;border-radius:2px 2px 0 0}.bars i.c{background:var(--pink)}
.legend{font-size:.72rem;color:var(--muted);margin-top:6px}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}
.item{border-top:1px dashed #0003;padding:9px 0;font-size:.85rem;word-break:break-word}.item:first-of-type{border-top:0}.meta{color:var(--muted);font-size:.74rem}
.btns{display:flex;gap:8px;margin-top:6px}button{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:9px;padding:6px 12px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);cursor:pointer}button.ok{background:var(--teal);color:#fff}button.no{background:#fff}button:disabled{opacity:.5}
.tag{display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;margin-right:4px}
.empty{color:var(--muted);font-size:.82rem}
a{color:var(--pinkdeep)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden></div>
<script>
const API='https://collectclock-api.j-chapman7.workers.dev';
let sess=null;try{sess=JSON.parse(localStorage.getItem('collect-clock-state-v3')||'{}').session||null}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=ts=>{if(!ts)return '';const m=Math.round((Date.now()-ts)/60000);if(m<60)return m+'m ago';const h=Math.round(m/60);return h<48?h+'h ago':Math.round(h/24)+'d ago'};
const link=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u.length>60?u.slice(0,57)+'…':u)}</a>`:'';
let data=null;
async function load(){if(!sess)return;let r;try{r=await fetch(API+'/admin/stats',{headers:{Authorization:'Bearer '+sess},cache:'no-store'})}catch{return}if(!r.ok)return;data=await r.json();render()}
function render(){const d=data,app=document.querySelector('#app');
const cs=Object.entries(d.casinos||{}).map(([k,v])=>({k,...v}));
const c7=cs.reduce((a,b)=>a+b.collect7,0),k7=cs.reduce((a,b)=>a+b.clicks7,0);
const nd=Object.entries(d.newUsers||{}).sort().slice(-14);
const days=(d.perDay||[]).slice().reverse();const mx=Math.max(1,...days.map(x=>x.clicks));
const top=cs.filter(x=>x.collect7>0).sort((a,b)=>b.collect7-a.collect7).slice(0,5);
const ov=Object.entries(d.overrides||{});
const sup=d.support||[];
app.innerHTML=`<h1>CollectClock · staff</h1><p class="sub">Updated ${new Date(d.generated).toLocaleString()} · <a href="#" id="reload">refresh</a></p>
<div class="tiles"><div class="tile"><b>${d.members}</b><span>Degens collecting</span></div><div class="tile"><b>${c7}</b><span>Collects · 7d</span></div><div class="tile"><b>${k7}</b><span>Link clicks · 7d</span></div><div class="tile"><b>${(d.pending||[]).length}</b><span>Edits to review</span></div><div class="tile"><b>${sup.length}</b><span>Suggestions + messages</span></div><div class="tile"><b>${d.drops.count}</b><span>Drops live (48h)</span></div></div>
<div class="box"><h2>Beta edits waiting</h2>${(d.pending||[]).length?d.pending.map(p=>`<div class="item" data-id="${esc(p.id)}"><b>${esc(p.casino)}</b> <span class="meta">by ${esc(p.by&&p.by.name||'beta tester')} · ${ago(p.at)}</span><div>Link: ${p.claim?link(p.claim):'<span class="meta">(default)</span>'}</div><div>Bonus: ${p.bonus?esc(p.bonus):'<span class="meta">(default)</span>'}</div><div>Note: ${p.note?esc(p.note):'<span class="meta">(none)</span>'}</div>${p.hours?`<div>Every: ${esc(String(p.hours))}h</div>`:''}${p.logo?`<div>Logo: <img src="${esc(p.logo)}" alt="" style="width:28px;height:28px;border-radius:50%;vertical-align:middle"></div>`:''}<div class="btns"><button class="ok" data-act="approve">Approve</button><button class="no" data-act="reject">Reject</button></div></div>`).join(''):'<p class="empty">Nothing waiting.</p>'}</div>
<div class="box"><h2>Top casinos this week</h2>${top.length?`<table><tr><th>Casino</th><th class="n">Collects 7d</th></tr>${top.map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${x.collect7}</td></tr>`).join('')}</table>`:'<p class="empty">No collects counted yet.</p>'}</div>
<div class="box"><h2>Activity · 30 days</h2><div class="bars">${days.map(x=>`<i style="height:${Math.round(x.clicks/mx*100)}%" title="${esc(x.day)}: ${x.clicks} clicks"></i>`).join('')}</div><div class="bars" style="height:40px;margin-top:4px">${days.map(x=>`<i class="c" style="height:${Math.round(x.collects/mx*100)}%" title="${esc(x.day)}: ${x.collects} collects"></i>`).join('')}</div><div class="legend"><b style="background:var(--teal)"></b>all link clicks<b style="background:var(--pink)"></b>collects · oldest left, today right</div></div>
<div class="box"><h2>New users per day</h2>${nd.length?`<table><tr><th>Day</th><th class="n">New</th></tr>${nd.reverse().map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')}</table>`:'<p class="empty">No new users counted yet (counting started with this release).</p>'}</div>
<div class="box"><h2>Clicks per casino</h2><p class="meta" style="margin:0 0 6px">Taps on Collect, the casino icon, Sign up and Visit. These are clicks, not confirmed sign-ups.</p>${cs.length?`<table><tr><th>Casino</th><th class="n">Collect 7d</th><th class="n">Collect 30d</th><th class="n">Clicks 7d</th><th class="n">Clicks 30d</th><th class="n">Icon 30d</th><th class="n">Sign up 30d</th></tr>${cs.sort((a,b)=>b.clicks30-a.clicks30).map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${x.collect7}</td><td class="n">${x.collect30}</td><td class="n">${x.clicks7}</td><td class="n">${x.clicks30}</td><td class="n">${x.icon30}</td><td class="n">${x.signup30}</td></tr>`).join('')}</table>`:'<p class="empty">No clicks counted yet.</p>'}</div>
<div class="box"><h2>Add-a-casino, feedback + contact</h2>${sup.length?sup.slice(0,60).map(s=>`<div class="item"><span class="tag">${esc(s.kind||'contact')}</span><span class="meta">${esc(s.byName||(s.kind==='casino'?'someone':s.name)||'someone')} · ${ago(s.at)}</span>${s.kind==='casino'?`<div><b>${esc(s.name)}</b> ${link(s.url)}</div>${s.ref?`<div>Referral: ${link(s.ref)}</div>`:''}${s.note?`<div>${esc(s.note)}</div>`:''}`:`<div>${esc(s.message)}</div>${s.contact?`<div class="meta">Reach: ${esc(s.contact)}</div>`:''}`}</div>`).join(''):'<p class="empty">Nothing yet.</p>'}</div>
<div class="box"><h2>Casino reports</h2><p class="meta" style="margin:0 0 6px">Flags show on the site at ${d.minReporters}+ players in 30 days.</p>${Object.keys(d.reportSummary||{}).length?`<table><tr><th>Casino</th><th>Flag</th><th class="n">Players</th></tr>${Object.entries(d.reportSummary).flatMap(([k,l])=>l.map(f=>`<tr><td>${esc(k)}</td><td>${esc(f.label)}</td><td class="n">${f.reporters}</td></tr>`)).join('')}</table>`:'<p class="empty">No casino over the flag threshold.</p>'}${(d.reports||[]).length?(d.reports.map(r=>`<div class="item"><b>${esc(r.casino)}</b> · ${esc(r.label)} <span class="meta">${ago(r.at)}${r.withdrawn?' · withdrawn':''}${r.weight===0?' · ignored (rant, no receipts)':''}</span><div class="meta">${[r.amount?'$'+r.amount:'',r.days?r.days+' days':'',r.ticket?'ticket '+esc(r.ticket):''].filter(Boolean).join(' · ')}</div>${r.details?`<div>${esc(r.details)}</div>`:''}</div>`).join('')):'<p class="empty">No reports yet.</p>'}</div>
<div class="box"><h2>Live info overrides</h2>${ov.length?ov.map(([k,o])=>`<div class="item"><b>${esc(o.casino||k)}</b> <span class="meta">${ago(o.at)}${o.by&&o.by.name?' · '+esc(o.by.name):''}${o.by&&o.by.approvedBy?' · approved by '+esc(o.by.approvedBy):''}</span>${o.claim?`<div>Link: ${link(o.claim)}</div>`:''}${o.bonus?`<div>Bonus: ${esc(o.bonus)}</div>`:''}${o.note?`<div>Note: ${esc(o.note)}</div>`:''}${o.hours?`<div>Every: ${esc(String(o.hours))}h</div>`:''}${o.logo?`<div>Logo: <img src="${esc(o.logo)}" alt="" style="width:28px;height:28px;border-radius:50%;vertical-align:middle"></div>`:''}</div>`).join(''):'<p class="empty">None. Tap the ★ on a card to set one.</p>'}</div>
<div class="box"><h2>Health</h2><div class="meta">Drops last pulled ${d.drops.updated?ago(d.drops.updated):'never'}${d.drops.error?' · last error '+esc(d.drops.error):''} · role grants queued: ${d.rolesPending}</div></div>`;
app.hidden=false;
document.querySelector('#reload').onclick=e=>{e.preventDefault();load()};
app.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{const it=b.closest('[data-id]');it.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await fetch(API+'/admin/review',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+sess},body:JSON.stringify({id:it.dataset.id,action:b.dataset.act})});if(r.ok){it.innerHTML=`<span class="meta">${b.dataset.act==='approve'?'Approved, live now.':'Rejected.'}</span>`}else{it.querySelectorAll('button').forEach(x=>x.disabled=false)}}catch{it.querySelectorAll('button').forEach(x=>x.disabled=false)}});
}
load();
</script>
</body>
</html>
